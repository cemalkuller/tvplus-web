<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" class="nolimit-svg-logo">
  <defs>
    <linearGradient id="nlInfinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C951" />
      <stop offset="50%" stop-color="#00E660" />
      <stop offset="100%" stop-color="#009940" />
    </linearGradient>
    <filter id="nlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon: Sleek Infinite Loop with Play Arrow -->
  <g transform="translate(4, 8)">
    <path d="M14 24 C14 17.5 19.5 12 26 12 C32.5 12 37.5 16.5 42 24 C46.5 31.5 51.5 36 58 36 C64.5 36 70 30.5 70 24 C70 17.5 64.5 12 58 12 C51.5 12 46.5 16.5 42 24 C37.5 31.5 32.5 36 26 36 C19.5 36 14 30.5 14 24 Z" 
          stroke="#1E2738" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M14 24 C14 17.5 19.5 12 26 12 C32.5 12 37.5 16.5 42 24 C46.5 31.5 51.5 36 58 36 C64.5 36 70 30.5 70 24 C70 17.5 64.5 12 58 12 C51.5 12 46.5 16.5 42 24 C37.5 31.5 32.5 36 26 36 C19.5 36 14 30.5 14 24 Z" 
          stroke="url(#nlInfinityGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#nlGlow)" />
    <polygon points="56,20 62,24 56,28" fill="#00C951" />
  </g>

  <!-- Brand Typography: "NoLimit" -->
  <text x="88" y="43" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.03em" fill="#FFFFFF">
    No<tspan fill="#00C951">Limit</tspan>
  </text>
  
  <circle cx="218" cy="22" r="3.5" fill="#00C951" filter="url(#nlGlow)" />
</svg>
